{% extends "base.html" %}
{% block title %}Student · SecureAttend{% endblock %}
{% block content %}
<section class="card">
  <h2>This device</h2>
  <p id="device-status" class="muted">Checking…</p>
  <button id="bind-btn" class="primary hidden">Register this phone</button>
</section>

<section class="card">
  <h2>Mark attendance</h2>
  <div id="reader"></div>
  <div class="row">
    <button id="scan-btn" class="primary">Scan class QR</button>
    <label class="filebtn">Scan from image<input id="scan-file" type="file" accept="image/*" hidden></label>
  </div>
  <div id="scan-result"></div>
  <details class="small">
    <summary>Paste QR text (testing without a camera)</summary>
    <div class="row"><input id="manual-token" placeholder="sessionid.window.tag"><button id="manual-btn">Submit</button></div>
  </details>
</section>

<section class="card">
  <h2>My attendance</h2>
  <table id="att-table"><thead><tr><th>Course</th><th>Present</th><th>%</th></tr></thead><tbody></tbody></table>
  <p class="muted small" id="threshold"></p>
</section>
{% endblock %}
{% block scripts %}
<script src="/static/vendor/html5-qrcode.min.js"></script>
<script src="/static/js/device.js"></script>
<script src="/static/js/student.js"></script>
{% endblock %}
