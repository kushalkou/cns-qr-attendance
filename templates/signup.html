{% extends "base.html" %}
{% block title %}Sign up · SecureAttend{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Student sign up</h1>
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <form method="post" action="/signup" class="stack">
    <label>USN <input name="username" placeholder="01FE23BCS106" required></label>
    <label>Full name <input name="name" required></label>
    <label>Password (min 8 chars) <input name="password" type="password" minlength="8" autocomplete="new-password" required></label>
    <button class="primary">Create account</button>
  </form>
  <p class="muted small">Your password is stored only as an Argon2id hash.</p>
</div>
{% endblock %}
